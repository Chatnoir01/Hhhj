name: Telegram Manager Tests

on:
  push:
    branches:
      - telegram-community-manager
    paths:
      - "telegram-community-manager/**"
      - ".github/workflows/telegram-manager-tests.yml"
  pull_request:
    paths:
      - "telegram-community-manager/**"
      - ".github/workflows/telegram-manager-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-community-manager

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: telegram-community-manager/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
