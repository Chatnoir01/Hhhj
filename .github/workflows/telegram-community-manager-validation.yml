name: Telegram Community Manager Validation

on:
  push:
    branches: [telegram-community-manager]
    paths:
      - "telegram-community-manager/**"
      - ".github/workflows/telegram-community-manager-validation.yml"
  pull_request:
    paths:
      - "telegram-community-manager/**"
      - ".github/workflows/telegram-community-manager-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram-community-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-community-manager/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app tests
      - name: Run full test suite
        env:
          DRY_RUN: "true"
        run: pytest -q
      - name: Run 1700-member validation explicitly
        env:
          DRY_RUN: "true"
        run: pytest -q tests/test_campaign_engine.py::test_1700_member_dry_run_completes_in_100_batches
