name: telegram-community-manager-ci

on:
  push:
    paths:
      - "telegram-community-manager/**"
  pull_request:
    paths:
      - "telegram-community-manager/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-community-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-community-manager/requirements.txt
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Test
        run: pytest -q
