name: telegram-community-manager-ci

on:
  push:
    branches:
      - telegram-community-manager
    paths:
      - "telegram-community-manager/**"
      - ".github/workflows/telegram-community-manager-ci.yml"
  pull_request:
    paths:
      - "telegram-community-manager/**"
      - ".github/workflows/telegram-community-manager-ci.yml"

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-community-manager

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: telegram-community-manager/requirements.txt

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q
